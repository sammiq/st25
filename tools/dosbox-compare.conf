# Run the original DOS game to compare side by side with the port:
#   cd <repo root> && dosbox -conf tools/dosbox-compare.conf
# As dosbox-startrek.conf (Sound Blaster 2.0: FM music on the OPL, 8 bit
# digital sound), but with no CRT shader: nearest-neighbour scaling to 4:3 in
# a 960x720 window, the same as the port's default (--scale 3).  Settings are
# DOSBox Staging's.
[sdl]
fullscreen       = false
windowresolution = 960x720

[render]
glshader        = nearest
aspect          = on
integer_scaling = off

[cpu]
core   = auto
cputype = auto
cpu_cycles = 60000

[dosbox]
machine = svga_paradise
memsize = 16

[sblaster]
sbtype  = sb2
sbbase  = 220
irq     = 7
dma     = 1
sbmixer = true
oplmode = opl2

[mixer]
rate      = 48000
blocksize = 1024

[autoexec]
@echo off
mount c orig/CD/TREKCD
c:
set BLASTER=A220 I7 D1 T3
rem arguments: video(0=VGA) input(1=mouse) music(4=SB FM) digital(4=SB) port irq (0 = from BLASTER) + 2 unused
STARTREK.EXE 0 1 4 4 0 0 0 0
