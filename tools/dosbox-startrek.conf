# Run the original DOS game for comparison with the port:
#   cd <repo root> && dosbox -conf tools/dosbox-startrek.conf
# Sound Blaster 2.0 (FM music on the OPL, 8 bit digital sound), as the game's
# SBFM / SBLASTER drivers expect via the BLASTER variable.
[sdl]
fullscreen = false

[cpu]
core   = auto
cputype = auto
cpu_cycles = 60000

[dosbox]
machine = svga_paradise
memsize = 16

[sblaster]
sbtype  = sb2
sbbase  = 220
irq     = 7
dma     = 1
sbmixer = true
oplmode = opl2

[mixer]
rate      = 48000
blocksize = 1024

[autoexec]
@echo off
mount c orig/CD/TREKCD
c:
set BLASTER=A220 I7 D1 T3
rem arguments: video(0=VGA) input(1=mouse) music(4=SB FM) digital(4=SB) port irq (0 = from BLASTER) + 2 unused
STARTREK.EXE 0 1 4 4 0 0 0 0
